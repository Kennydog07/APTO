# Keep the private e-commerce project folder off the public APTO site.
[[redirects]]
  from = "/uk-ecommerce/*"
  to = "/uk-ecommerce-not-public"
  status = 404
  force = true

[[redirects]]
  from = "/business.html"
  to = "/business"
  status = 301
  force = true

[[redirects]]
  from = "/personal.html"
  to = "/wealth"
  status = 301
  force = true

[[redirects]]
  from = "/personal"
  to = "/wealth"
  status = 301
  force = true

[build]
  publish = "."
  functions = "functions"
